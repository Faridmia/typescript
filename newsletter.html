<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .newsletter {
            max-width: 450px;
            width: 100%;
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .newsletter h2 {
            font-size: 28px;
            color: #222;
            margin-bottom: 12px;
        }

        .newsletter p {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .newsletter form {
            display: flex;
            gap: 10px;
        }

        .newsletter input[type="email"] {
            flex: 1;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .newsletter input[type="email"]:focus {
            border-color: #2563eb;
        }

        .newsletter button {
            padding: 14px 22px;
            border: none;
            background: #2563eb;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .newsletter button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 500px) {
            .newsletter form {
                flex-direction: column;
            }

            .newsletter button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <section class="newsletter">
        <h2>Subscribe to Our Newsletter</h2>
        <p>
            Subscribe to receive the latest news, updates, and exclusive offers directly in your inbox.
        </p>

        <form>
            <input
                type="email" id="subscribe_email_id"
                placeholder="Enter your email address"
                required
            >

            <button type="submit" id="subscribe_button">
                Subscribe
            </button>
        </form>
    </section>

    <script type="module" src="./output/newsletter.js"></script>

</body>
</html>
